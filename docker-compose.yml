version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: lams-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongodb_data:/data/db
    networks:
      - lams-network

  redis:
    image: redis:7-alpine
    container_name: lams-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - lams-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lams-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - MONGODB_URI=mongodb://admin:password@mongodb:27017/lams-music-ai?authSource=admin
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=your_jwt_secret_key_here
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - lams-network

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: lams-ai-service
    ports:
      - "8000:8000"
    environment:
      - MODEL_PATH=/app/models
    volumes:
      - ./ai-service:/app
      - ./models:/app/models
    networks:
      - lams-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lams-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://backend:5000
      - VITE_AI_SERVICE_URL=http://ai-service:8000
    depends_on:
      - backend
    networks:
      - lams-network

volumes:
  mongodb_data:
  redis_data:

networks:
  lams-network:
    driver: bridge
